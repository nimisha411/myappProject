version: 0.2

phases:
  install:
    commands:
      - echo Installing Docker...

  pre_build:
    commands:
      - echo Starting Docker build...

  build:
    commands:
      - docker build -t myapp .
      - docker run myapp

  post_build:
    commands:
      - echo Build completed successfully

artifacts:
  files:
    - '**/*'
